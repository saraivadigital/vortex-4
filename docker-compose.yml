services:
  ollama:
    image: ollama/ollama:latest
    container_name: vortex4-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - vortex4-net
    # Não publique a porta 11434 no host.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: vortex4-backend
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:1.5b
      REQUEST_TIMEOUT: "180"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - vortex4-net

  web:
    image: nginx:1.27-alpine
    container_name: vortex4-web
    restart: unless-stopped
    ports:
      - "4444:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - vortex4-net

volumes:
  ollama_models:

networks:
  vortex4-net:
    driver: bridge
